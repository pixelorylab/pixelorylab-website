<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-dim:#4a4a4a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.12) 1px, transparent 0);
    background-size:24px 24px;
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo Black', sans-serif;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:5vw;
  }
  .logo{
    width:56px;
    height:56px;
    margin-bottom:2.2rem;
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.1s;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    color:var(--ink);
    font-size:clamp(3.5rem, 16vw, 18rem);
    line-height:0.88;
    letter-spacing:-0.01em;
    white-space:nowrap;
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.3s;
  }
  .wordmark{
    margin-top:2.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4rem;
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.55s;
  }
  .eyebrow{
    font-size:0.62rem;
    letter-spacing:0.35em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .brand{
    font-size:clamp(1rem, 2.4vw, 1.5rem);
    letter-spacing:0.14em;
    color:var(--ink);
    text-transform:uppercase;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .logo,h1,.wordmark{animation:none; opacity:1;}
  }
</style>
</head>
